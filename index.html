<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Concrete Dreams — Skate Park</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap');
:root{--ink:#131819;--paper:#f1eee5;--lime:#d9ff4f;--muted:#a9b0a7}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a5c4c0;color:var(--paper);font-family:'Barlow Condensed',sans-serif}canvas{display:block;position:fixed;inset:0;z-index:0}
.hud{position:fixed;inset:0;z-index:2;pointer-events:none;padding:26px 30px;display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 2px 12px #1118}
.top{display:flex;align-items:flex-start;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.mark{width:37px;height:37px;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-size:23px;font-weight:900;transform:rotate(-5deg);text-shadow:none}.title{font-weight:900;letter-spacing:.07em;font-size:21px;line-height:1}.subtitle{font:10px 'DM Mono',monospace;letter-spacing:.15em;color:#e2eee3;margin-top:5px}.scorebox{text-align:right}.score-label,.tiny{font:10px 'DM Mono',monospace;letter-spacing:.17em;color:#d4e5d9}.score{font-weight:900;font-size:44px;line-height:.95;color:var(--lime);font-variant-numeric:tabular-nums}.score small{font-size:15px;color:#fff}.center{position:absolute;top:24px;left:50%;transform:translateX(-50%);text-align:center;min-width:220px}.combo{font-size:18px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;opacity:0;transition:opacity .2s}.combo.active{opacity:1}.combo strong{color:var(--lime)}.meter{height:3px;background:#ffffff55;margin-top:7px;overflow:hidden}.meter span{display:block;height:100%;width:100%;background:var(--lime);transform-origin:left;transition:transform .12s}.bottom{display:flex;justify-content:space-between;align-items:flex-end}.tips{max-width:530px;display:flex;gap:7px;flex-wrap:wrap}.key{border:1px solid #ffffff68;background:#17201dc9;padding:7px 10px 6px;font:10px 'DM Mono',monospace;letter-spacing:.04em;border-radius:2px;color:#eaf1e5}.key b{color:var(--lime);font-weight:500}.speed{display:flex;align-items:flex-end;gap:8px}.speednum{font-size:38px;line-height:.85;font-weight:900}.speedunit{font:10px 'DM Mono',monospace;color:#dce7dc;letter-spacing:.1em}.toast{position:absolute;left:50%;top:33%;transform:translate(-50%,-50%) scale(.8);font-size:48px;font-weight:900;font-style:italic;letter-spacing:.06em;color:var(--lime);opacity:0;transition:.18s;text-shadow:0 3px 20px #0008;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.mini{position:absolute;right:30px;bottom:95px;font:9px 'DM Mono',monospace;letter-spacing:.14em;color:#e8f0e5;text-align:right}.mobile{display:none;pointer-events:auto;position:absolute;bottom:24px;left:20px;gap:7px}.mobile button{width:52px;height:52px;border:1px solid #fff8;background:#17201d99;color:white;border-radius:50%;font-size:18px;touch-action:none}
@media(max-width:700px){.hud{padding:18px}.title{font-size:17px}.score{font-size:35px}.center{top:80px}.bottom{align-items:flex-end}.tips{max-width:62%;gap:4px}.key{font-size:8px;padding:6px}.mini{display:none}.mobile{display:flex}.speednum{font-size:32px}}
</style>
</head>
<body>
<div class="hud">
 <div class="top"><div class="brand"><div class="mark">✳</div><div><div class="title">CONCRETE DREAMS</div><div class="subtitle">SKATE PLAZA — LOS ANGELES, CA</div></div></div><div class="scorebox"><div class="score-label">SESSION SCORE</div><div class="score" id="score">000000</div></div></div>
 <div class="center"><div class="combo" id="combo">— <strong id="comboScore">0</strong></div><div class="meter"><span id="meter"></span></div></div>
 <div class="toast" id="toast">SICK!</div>
 <div class="bottom"><div class="tips"><span class="key"><b>W A S D</b> RIDE</span><span class="key"><b>SPACE</b> OLLIE</span><span class="key"><b>← →</b> TRICKS</span><span class="key"><b>SHIFT</b> PUSH</span><span class="key"><b>R</b> RESET</span></div><div class="speed"><div class="speednum" id="speed">00</div><div class="speedunit">KM/H<br>ROLL OUT</div></div></div>
 <div class="mini">FIND YOUR LINE&nbsp; ↗<br>NO RULES. JUST CONCRETE.</div>
 <div class="mobile"><button data-key="w">▲</button><button data-key="a">◀</button><button data-key="d">▶</button><button data-key=" ">OLLIE</button></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#a9c8c3');scene.fog=new THREE.Fog('#a9c8c3',42,105);
const camera=new THREE.PerspectiveCamera(54,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight('#e4f5ea','#47534b',2.0));const sun=new THREE.DirectionalLight('#fff0d6',3.3);sun.position.set(-14,28,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;sun.shadow.bias=-.0003;scene.add(sun);
const mat=(color,rough=.8)=>new THREE.MeshStandardMaterial({color,roughness:rough});const concrete=mat('#c5c6b7'),edge=mat('#9ca498'),dark=mat('#343e3b'),lime=mat('#d9ff4f'),metal=mat('#7d928e',.32),brick=mat('#b36e54'),wood=mat('#c98d5d');
function box(parent,x,y,z,sx,sy,sz,m){let o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
// mottled concrete plaza
const ground=box(scene,0,-.35,0,62,.7,56,mat('#b8c5b8'));ground.receiveShadow=true;
const groundLines= new THREE.Group();scene.add(groundLines);
// expansion joints and subtle painted court lines
for(let x=-27;x<=27;x+=9){let l=box(groundLines,x,.007,0,.035,.01,52,mat('#9ea99d'));l.castShadow=false}
for(let z=-24;z<=24;z+=8){let l=box(groundLines,0,.008,z,58,.01,.035,mat('#9ea99d'));l.castShadow=false}
// ramp height field: quarter pipes at either end, mellow bank ramps and box
function smooth(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}
function terrain(x,z){let y=0;
 // west quarter pipe rises from x=-19 to x=-12
 if(Math.abs(z)<8&&x>-19&&x<-12)y=Math.max(y,3.8*smooth((x+19)/7));
 if(Math.abs(z)<8&&x>=-12&&x<-10)y=Math.max(y,3.8);
 // east quarter
 if(Math.abs(z)<8&&x>12&&x<19)y=Math.max(y,3.8*smooth((19-x)/7));
 if(Math.abs(z)<8&&x<=12&&x>10)y=Math.max(y,3.8);
 // bank ramps around central funbox
 if(Math.abs(z)<5&&x>-8&&x<-5)y=Math.max(y,1.25*smooth((x+8)/3));
 if(Math.abs(z)<5&&x>5&&x<8)y=Math.max(y,1.25*smooth((8-x)/3));
 if(Math.abs(x)<5&&Math.abs(z)<2.2)y=Math.max(y,1.25);
 // mellow banks north and south
 if(Math.abs(x)<7&&z>-14&&z<-10)y=Math.max(y,1.5*smooth((z+14)/4));
 if(Math.abs(x)<7&&z>10&&z<14)y=Math.max(y,1.5*smooth((14-z)/4));
 return y;
}
function makeRamp(x1,x2,z1,z2,fn,segments=40){const vertices=[],indices=[];for(let i=0;i<=segments;i++){let x=x1+(x2-x1)*i/segments;for(let j=0;j<=2;j++){let z=z1+(z2-z1)*j/2;vertices.push(x,fn(x,z)+.02,z)}}for(let i=0;i<segments;i++)for(let j=0;j<2;j++){let a=i*3+j,b=a+3;indices.push(a,b,a+1,b,b+1,a+1)}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));g.setIndex(indices);g.computeVertexNormals();let mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:'#d2d0c2',roughness:.9,side:THREE.DoubleSide}));mesh.receiveShadow=true;mesh.castShadow=true;scene.add(mesh);}
makeRamp(-19,-10,-8,8,(x,z)=>terrain(x,z));makeRamp(10,19,-8,8,(x,z)=>terrain(x,z));makeRamp(-8,-5,-5,5,(x,z)=>terrain(x,z));makeRamp(5,8,-5,5,(x,z)=>terrain(x,z));
// sloped bank surfaces north/south, triangulated along z
function bank(z1,z2){const vs=[],ix=[];for(let i=0;i<=30;i++){let z=z1+(z2-z1)*i/30;for(const x of [-7,7])vs.push(x,terrain(x,z)+.02,z)}for(let i=0;i<30;i++){let a=i*2;ix.push(a,a+2,a+1,a+1,a+2,a+3)}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(vs,3));g.setIndex(ix);g.computeVertexNormals();let o=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:'#c9c8b9',side:THREE.DoubleSide}));o.receiveShadow=true;scene.add(o)}bank(-14,-10);bank(10,14);
// steel coping bars at quarterpipe lips
for(const x of [-12,12]){let rail=box(scene,x,3.9,0,.16,.16,16,metal);rail.castShadow=true;}
// funbox side ledges and center tabletop
box(scene,0,.65,0,10,1.3,4.4,edge);box(scene,0,1.28,0,9.5,.12,4,concrete);
// ledges
for(const z of [-5.8,5.8]){box(scene,0,.48,z,8,.95,.7,brick);box(scene,0,.99,z,8,.12,.78,metal)}
// rails with metal supports
function rail(x1,z1,x2,z2,y){let a=new THREE.Vector3(x1,y,z1),b=new THREE.Vector3(x2,y,z2),d=b.clone().sub(a);let o=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,d.length(),10),metal);o.position.copy(a.add(b).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());o.castShadow=true;scene.add(o);for(let t of [.12,.88]){let p=new THREE.Vector3(x1,y,z1).lerp(new THREE.Vector3(x2,y,z2),t);let h=box(scene,p.x,y/2,p.z,.12,y,.12,dark);h.castShadow=true}return {x1,z1,x2,z2,y}}
const rails=[rail(-7,-3.3,7,-3.3,.85),rail(-7,3.3,7,3.3,.85),rail(-3,-8,3,-8,1.05),rail(-3,8,3,8,1.05)];
// details: picnic tables, benches, planters, palms, city skyline
for(const x of [-23,23]){for(const z of [-12,12]){box(scene,x,.65,z,2.7,1.3,2.7,mat('#899b89'));box(scene,x,.75,z,2.8,.18,2.8,mat('#71877a'));for(let i=0;i<5;i++){let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.23,3.5,7),wood);trunk.position.set(x+(i%2)*.5,2.5,z+(i%3)*.4);trunk.castShadow=true;scene.add(trunk);let crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.25,1),mat(i%2?'#789678':'#809b79'));crown.position.set(trunk.position.x,4.4,trunk.position.z);crown.scale.set(1.2,.7,1);crown.castShadow=true;scene.add(crown)}}}
// perimeter retaining walls and graphic skate park signage
for(const z of [-27,27])box(scene,0,.7,z,62,1.4,.5,dark);for(const x of [-30.5,30.5])box(scene,x,.7,0,.5,1.4,54,dark);
box(scene,0,1.1,-26.65,8,.8,.08,lime);const signText=box(scene,0,1.1,-26.55,7.6,.64,.06,dark); // simple graphic stripe
for(let i=-3;i<=3;i++)box(scene,i*1.1,1.1,-26.49,.045,.5,.025,lime);
// lamps
for(const [x,z] of [[-25,-20],[25,-20],[-25,20],[25,20]]){let pole=new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,7,8),dark);pole.position.set(x,3.5,z);pole.castShadow=true;scene.add(pole);box(scene,x,7,z,.8,.12,.35,lime)}
// skater group and board
const skater=new THREE.Group();scene.add(skater);const rider=new THREE.Group();skater.add(rider);
const skin=mat('#c98966'),shirt=mat('#ee674a'),pants=mat('#26313b'),shoe=mat('#f2e7d2'),hair=mat('#362f2b');
const torso=new THREE.Mesh(new THREE.BoxGeometry(.48,.62,.34),shirt);torso.position.y=1.12;torso.castShadow=true;rider.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.22,16,12),skin);head.position.set(0,1.62,0);head.castShadow=true;rider.add(head);
const cap=new THREE.Mesh(new THREE.SphereGeometry(.235,12,8,0,Math.PI*2,0,Math.PI/2),hair);cap.position.set(0,1.72,0);rider.add(cap);
function limb(parent,x,y,z,len,r,m,rot=0){let mesh=new THREE.Mesh(new THREE.CylinderGeometry(r*.75,r,len,8),m);mesh.position.set(x,y,z);mesh.rotation.z=rot;mesh.castShadow=true;parent.add(mesh);return mesh}
const leg1=limb(rider,-.14,.55,0,.55,.105,pants,-.12),leg2=limb(rider,.14,.55,0,.55,.105,pants,.12);
for(const x of [-.16,.16]){let s=box(rider,x,.22,.07,.27,.15,.4,shoe);s.rotation.z=x<0?-.08:.08}
const arm1=limb(rider,-.34,1.1,0,.58,.075,skin,-.5),arm2=limb(rider,.34,1.1,0,.58,.075,skin,.5);
const board=new THREE.Group();skater.add(board);let deck=box(board,0,.12,0,.42,.12,1.18,mat('#e65645'));deck.rotation.x=0;for(const z of [-.36,.36]){box(board,0,.035,z,.34,.09,.13,metal);for(const x of [-.17,.17]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.105,.105,.07,12),mat('#222a2c'));w.rotation.z=Math.PI/2;w.position.set(x,-.01,z);w.castShadow=true;board.add(w)}}
// state and mechanics
const keys={};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowleft','arrowright','arrowup','arrowdown'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()===' '&&!e.repeat)ollie();if(e.key.toLowerCase()==='r')reset()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('.mobile button').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();keys[b.dataset.key]=true;if(b.dataset.key===' ')ollie()});for(const ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>keys[b.dataset.key]=false)});
let pos=new THREE.Vector3(0,.15,12),vel=new THREE.Vector3(),yaw=Math.PI,airV=0,onGround=true,airTime=0,spin=0,score=0,combo=0,comboMult=1,comboTime=0,toastTimer=0,grinding=false,cameraReady=false,clock=new THREE.Clock();
function ollie(){if(onGround){airV=6.9+Math.min(vel.length()*.13,1.8);onGround=false;airTime=0;spin=0;}}
function reset(){pos.set(0,.15,12);vel.set(0,0,0);yaw=Math.PI;airV=0;onGround=true;combo=0;comboMult=1;updateHUD()}
function showToast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');toastTimer=.75}
function trick(label,base){if(!onGround){combo+=base*comboMult;comboMult=Math.min(comboMult+1,8);showToast(label);}}
function updateHUD(){document.getElementById('score').textContent=String(score).padStart(6,'0');document.getElementById('comboScore').textContent=combo.toLocaleString();document.getElementById('combo').classList.toggle('active',combo>0);document.getElementById('meter').style.transform=`scaleX(${Math.max(0,comboTime/2.5)})`;document.getElementById('speed').textContent=String(Math.round(vel.length()*7)).padStart(2,'0')}
let trickLatch={arrowleft:false,arrowright:false};
function update(dt){dt=Math.min(dt,.035);let forward=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));let side=new THREE.Vector3(forward.z,0,-forward.x);
 let steer=(keys.a||keys.arrowleft?1:0)-(keys.d||keys.arrowright?1:0);let drive=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
 if(keys.shift&&onGround)drive+=1.2;
 yaw+=steer*dt*(onGround?1.8:1.05)*Math.min(1,vel.length()*.35+.25);
 forward.set(Math.sin(yaw),0,Math.cos(yaw));side.set(forward.z,0,-forward.x);
 if(onGround){vel.addScaledVector(forward,drive*dt*(keys.shift?14:7));vel.multiplyScalar(Math.pow(.985,dt*60));let lateral=vel.dot(side);vel.addScaledVector(side,-lateral*Math.min(1,dt*3.5));if(vel.length()>13)vel.setLength(13);
 // roll naturally down and up terrain gradients
 const here=terrain(pos.x,pos.z);const ahead=terrain(pos.x+forward.x*.3,pos.z+forward.z*.3);vel.addScaledVector(forward,(here-ahead)*dt*7);
 }else{vel.multiplyScalar(Math.pow(.998,dt*60));airV-=17*dt;airTime+=dt;
 if(keys.arrowleft&&!trickLatch.arrowleft){spin+=Math.PI/2;trick('SHUVIT',150)}if(keys.arrowright&&!trickLatch.arrowright){spin-=Math.PI/2;trick('KICKFLIP',200)}trickLatch.arrowleft=!!keys.arrowleft;trickLatch.arrowright=!!keys.arrowright;
 if(keys.a)yaw+=dt*1.1;if(keys.d)yaw-=dt*1.1;
 }
 pos.x+=vel.x*dt;pos.z+=vel.z*dt;pos.x=THREE.MathUtils.clamp(pos.x,-27,27);pos.z=THREE.MathUtils.clamp(pos.z,-23,23);
 let floor=terrain(pos.x,pos.z)+.16;
 // grind when close to rails while grounded, hopping onto them gives bonus
 grinding=false;for(const r of rails){let dx=r.x2-r.x1,dz=r.z2-r.z1,t=THREE.MathUtils.clamp(((pos.x-r.x1)*dx+(pos.z-r.z1)*dz)/(dx*dx+dz*dz),0,1),qx=r.x1+t*dx,qz=r.z1+t*dz,dist=Math.hypot(pos.x-qx,pos.z-qz);if(dist<.46&&Math.abs((pos.y+.14)-r.y)<.8&&vel.length()>1.3){grinding=true;floor=r.y+.12;pos.x=qx;pos.z=qz;combo+=Math.round(22*dt*comboMult);comboTime=2.5;break}}
 if(!onGround&&pos.y<=floor&&airV<0){pos.y=floor;airV=0;onGround=true;if(combo>0){score+=Math.round(combo);showToast('+'+Math.round(combo));combo=0;comboMult=1}airTime=0}
 if(onGround){if(!grinding)pos.y+=(floor-pos.y)*Math.min(1,dt*18);else pos.y=floor;}else pos.y+=airV*dt;
 if(onGround&&!grinding){let slope=(terrain(pos.x+.22,pos.z)-terrain(pos.x-.22,pos.z));skater.rotation.z=THREE.MathUtils.lerp(skater.rotation.z,-slope*.07,.12);skater.rotation.x=THREE.MathUtils.lerp(skater.rotation.x,0,.12);}
 if(!onGround){skater.rotation.x=THREE.MathUtils.lerp(skater.rotation.x,spin+Math.sin(airTime*12)*.08,.22);rider.rotation.z=THREE.MathUtils.lerp(rider.rotation.z,keys.a?.3:keys.d?-.3:0,.14);}
 else {skater.rotation.x=THREE.MathUtils.lerp(skater.rotation.x,0,.18);rider.rotation.z=THREE.MathUtils.lerp(rider.rotation.z,0,.15)}
 skater.position.copy(pos);skater.rotation.y=yaw;board.position.y=-.12+(onGround?Math.sin(performance.now()*.012)*.015:Math.sin(airTime*18)*.06);board.rotation.z=steer*.12;
 // skater rides board with crouch and arm balance
 rider.position.y=onGround?0:Math.sin(airTime*10)*.06;rider.rotation.x=onGround?-.08:(keys.w?-.12:.12);arm1.rotation.z=-.5+Math.sin(performance.now()*.005)*.08;arm2.rotation.z=.5-Math.sin(performance.now()*.005)*.08;
 if(combo>0&&!grinding){comboTime-=dt;if(comboTime<=0){combo=0;comboMult=1;showToast('BAIL!')}}
 if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)document.getElementById('toast').classList.remove('show')}
 // camera chase with subtle lean
 let target=pos.clone().add(new THREE.Vector3(0,.8,0));let desired=pos.clone().addScaledVector(forward,-9).add(new THREE.Vector3(0,5.4,0));if(!cameraReady){camera.position.copy(desired);cameraReady=true}else camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(target);
 updateHUD();
}
const clock2=new THREE.Clock();function frame(){requestAnimationFrame(frame);update(clock2.getDelta());renderer.render(scene,camera)}frame();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
